<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Tło zapewniające wysoki kontrast w jasnym i ciemnym trybie przeglądarki -->
  <rect width="512" height="512" rx="128" fill="#0F172A"/>

  <!-- Tło paska postępu (szary nieaktywny łuk - pozostałe 50%) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#334155" stroke-width="36"/>

  <!-- Podświetlony pasek postępu (dokładnie 50% - zielony akcent) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#10B981" stroke-width="36"
          stroke-dasharray="581.2 1162.4" stroke-linecap="round" transform="rotate(-90 256 256)"/>

  <!-- Talerz (zewnętrzna i wewnętrzna krawędź) -->
  <circle cx="256" cy="256" r="120" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="95" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Sztućce symbolizujące posiłek -->
  <!-- Widelec (po lewej) -->
  <path d="M 205 190 v 35 c 0 10 8 15 8 25 v 65 a 5 5 0 0 0 10 0 v -65 c 0 -10 8 -15 8 -25 v -35 h -5 v 25 h -3 v -25 h -5 v 25 h -3 v -25 z" fill="#475569"/>

  <!-- Nóż (po prawej) -->
  <path d="M 307 190 c 0 0 14 12 14 45 h -14 v 80 a 5 5 0 0 1 -10 0 v -125 z" fill="#475569"/>

  <!-- Symboliczna porcja jedzenia (akcent w centrum) -->
  <circle cx="256" cy="256" r="22" fill="#F59E0B"/>
  <path d="M 245 245 c 8 -12 22 -12 30 0 c -8 12 -22 12 -30 0 Z" fill="#22C55E"/>
</svg>
