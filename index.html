<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Żetpepe - Żryj Przez Pół</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-container">
            <div class="logo-icon">
                <div class="progress-bar-icon"><span class="bar-fill"></span></div>
            </div>
            <h1>Żetpepe</h1>
        </div>
        <div class="header-actions">
            <button id="theme-toggle-btn" class="icon-btn" title="Zmień motyw">🌙</button>
            <button id="resolutions-btn" class="btn btn-secondary">🎯 Postanowienia</button>
            <button id="stats-btn" class="btn btn-secondary">📊 Statystyki</button>
            <button id="auth-btn" class="btn btn-outline">🔒 PIN</button>
        </div>
    </header>

    <main class="container">
        <section class="calendar-controls">
            <button id="prev-month-btn" class="btn btn-icon">&lt;</button>
            <h2 id="current-month-label">---</h2>
            <button id="next-month-btn" class="btn btn-icon">&gt;</button>
        </section>

        <section id="calendar-grid" class="calendar-grid">
            <!-- Kafle dni wygenerowane dynamicznie -->
        </section>
    </main>

    <!-- Modal Edycji Dnia -->
    <div id="day-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-date-title">Edycja dnia</h3>
                <button class="close-btn" data-close="day-modal">&times;</button>
            </div>
            <form id="day-form">
                <input type="hidden" id="entry-date">
                
                <div class="form-group">
                    <label for="entry-weight">Waga (kg):</label>
                    <input type="number" id="entry-weight" step="0.1" min="30" max="150" placeholder="np. 82.5">
                </div>

                <div class="form-group">
                    <label>Zdarzenia dnia:</label>
                    <div id="events-dropdown" class="multiselect-container">
                        <label class="multiselect-option"><input type="checkbox" value="bike"> 🚴 Rower</label>
                        <label class="multiselect-option"><input type="checkbox" value="walk"> 🚶 Spacer</label>
                        <label class="multiselect-option"><input type="checkbox" value="run"> 🏃 Bieganie</label>
                        <label class="multiselect-option"><input type="checkbox" value="swim"> 🏊 Pływanie</label>
                        <label class="multiselect-option"><input type="checkbox" value="workout"> 🏋️ Ćwiczenia</label>
                        <label class="multiselect-option"><input type="checkbox" value="icecream"> 🍦 Lody</label>
                        <label class="multiselect-option"><input type="checkbox" value="donut"> 🍩 Słodycze</label>
                        <label class="multiselect-option"><input type="checkbox" value="alcohol"> 🍺 Alkohol</label>
                        <label class="multiselect-option"><input type="checkbox" value="snacks"> 🍿 Przekąski</label>
                        <label class="multiselect-option"><input type="checkbox" value="restaurant"> 🍽️ Restauracja</label>
                        <label class="multiselect-option"><input type="checkbox" value="fastfood"> 🍔 Fastfood</label>
                        <label class="multiselect-option"><input type="checkbox" value="nightfood"> 🌙 Jedzenie w nocy</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ocena dnia:</label>
                    <div class="color-picker">
                        <label class="color-option gold-option">
                            <input type="radio" name="day-color" value="gold">
                            <span class="color-box">
                                <span class="dot">🟡</span>
                                <span>Idealnie</span>
                            </span>
                        </label>
                        <label class="color-option green-option">
                            <input type="radio" name="day-color" value="green">
                            <span class="color-box">
                                <span class="dot">🟢</span>
                                <span>Ok</span>
                            </span>
                        </label>
                        <label class="color-option orange-option">
                            <input type="radio" name="day-color" value="orange">
                            <span class="color-box">
                                <span class="dot">🟠</span>
                                <span>Była wtopa</span>
                            </span>
                        </label>
                        <label class="color-option red-option">
                            <input type="radio" name="day-color" value="red">
                            <span class="color-box">
                                <span class="dot">🔴</span>
                                <span>Dzień stracony</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="entry-notes">Notatki:</label>
                    <textarea id="entry-notes" rows="3" placeholder="Krótki opis dnia..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" id="delete-entry-btn" class="btn btn-danger hidden">Usuń wpis</button>
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Postanowienia -->
    <div id="resolutions-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🎯 Postanowienia</h3>
                <button class="close-btn" data-close="resolutions-modal">&times;</button>
            </div>
            <div class="resolutions-body">
                <form id="add-resolution-form" class="inline-form">
                    <input type="text" id="resolution-input" placeholder="Nowe postanowienie..." required>
                    <button type="submit" class="btn btn-primary">Dodaj</button>
                </form>
                <ul id="resolutions-list" class="resolutions-list"></ul>
            </div>
        </div>
    </div>

    <!-- Modal Statystyki -->
    <div id="stats-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>📊 Statystyki i Postęp</h3>
                <button class="close-btn" data-close="stats-modal">&times;</button>
            </div>
            <div class="stats-body">
                <div class="stats-summary-cards">
                    <div class="stat-card">
                        <span class="stat-label">Waga początkowa</span>
                        <span id="stat-start-weight" class="stat-value">-- kg</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Waga aktualna</span>
                        <span id="stat-current-weight" class="stat-value">-- kg</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Różnica całkowita</span>
                        <span id="stat-diff-total" class="stat-value">-- kg</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Różnica (ostatnie 30 dni)</span>
                        <span id="stat-diff-month" class="stat-value">-- kg</span>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="weight-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Chart.js -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
